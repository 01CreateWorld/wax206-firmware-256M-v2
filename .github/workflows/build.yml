name: Build WAX206 256M OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 初始化编译环境
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev file wget device-tree-compiler u-boot-tools

      - name: 克隆 OpenWrt 官方源码并应用配置
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cp .config openwrt/.config
          cp patch_dts.py openwrt/

      - name: 应用 256M 大空间设备树补丁
        run: |
          cd openwrt
          python3 patch_dts.py
          echo "====== 验证 DTS 注入结果 ======"
          grep -A 4 -n 'label = "ubi";' target/linux/mediatek/dts/mt7622-netgear-wax206.dts

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 下载依赖包
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 整理产物
        run: |
          mkdir -p bin_output
          find openwrt/bin/targets/mediatek/mt7622/ -type f \( -name "*wax206*.itb" -o -name "*wax206*.bin" -o -name "*wax206*.img" \) -exec cp -v {} bin_output/ \;
          ls -lh bin_output/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netgear-wax206-firmware
          path: bin_output/
