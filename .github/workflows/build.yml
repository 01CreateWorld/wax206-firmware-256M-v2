name: Build WAX206 256M OpenWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 初始化编译环境
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: 克隆 OpenWrt 官方源码
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cp -r patches openwrt/
          cp diy.sh openwrt/
          cp .config openwrt/.config

      - name: 执行准备脚本与 Feeds
        run: |
          cd openwrt
          chmod +x diy.sh
          ./diy.sh
          make defconfig

      - name: 下载依赖包
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 整理产物
        run: |
          mkdir -p bin_output
          find openwrt/bin/targets/mediatek/filogic/ -type f \( -name "*wax206*initramfs*.bin" -o -name "*wax206*sysupgrade*.bin" \) -exec cp {} bin_output/ \;

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: netgear-wax206-firmware
          path: bin_output/
