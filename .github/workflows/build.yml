name: Build WAX206 256M OpenWrt

on:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 初始化编译环境
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev file wget device-tree-compiler u-boot-tools

      - name: 克隆源码并直接注入 256M 分区修改
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cp .config openwrt/.config
          
          cd openwrt
          # 1. 扩展 DTS 分区尺寸至约 192MB
          sed -i 's/reg = <0x2000000 0x2000000>;/reg = <0x4000000 0xc000000>;/g' target/linux/mediatek/dts/mt7622-netgear-wax206.dts
          sed -i 's/partition@2000000 {/partition@4000000 {/g' target/linux/mediatek/dts/mt7622-netgear-wax206.dts

          # 2. 声明 Makefile 卷尺寸
          sed -i '/define Device\/netgear_wax206/,/endef/ s/SUPPORTED_DEVICES += netgear,wax206/SUPPORTED_DEVICES += netgear,wax206\n  UBI_ROOT_SIZE := 160MiB/' target/linux/mediatek/image/mt7622.mk

          # 3. 严格校验熔断：若未成功替换，立即红牌退出，杜绝无效编译
          echo "====== 检查 DTS 替换状态 ======"
          grep -n "0xc000000" target/linux/mediatek/dts/mt7622-netgear-wax206.dts || { echo "::error::DTS 替换失败！"; exit 1; }

          echo "====== 检查 Makefile 替换状态 ======"
          grep -n "UBI_ROOT_SIZE := 160MiB" target/linux/mediatek/image/mt7622.mk || { echo "::error::Makefile 替换失败！"; exit 1; }

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 下载依赖包
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 整理产物
        run: |
          mkdir -p bin_output
          find openwrt/bin/targets/mediatek/mt7622/ -type f \( -name "*wax206*.itb" -o -name "*wax206*.bin" -o -name "*wax206*.img" \) -exec cp -v {} bin_output/ \;
          ls -lh bin_output/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netgear-wax206-firmware
          path: bin_output/
