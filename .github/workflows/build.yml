name: Build WAX206 256M OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 初始化编译环境
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev file wget device-tree-compiler u-boot-tools

      - name: 克隆 OpenWrt 官方源码
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cp .config openwrt/.config

      - name: 应用 256M 大空间设备树补丁
        run: |
          cd openwrt
          # 使用精准的 Python 结构替换，只扩大 ubi 节点并安全擦除后续出厂冗余分区块
          python3 -c '
          with open("target/linux/mediatek/dts/mt7622-netgear-wax206.dts", "r") as f:
              content = f.read()

          target_str = """\
  				partition@600000 {
  					label = "ubi";
  					reg = <0x600000 0x22c0000>;
  				};
  			};"""

          replacement_str = """\
  				partition@600000 {
  					label = "ubi";
  					reg = <0x600000 0xfa00000>;
  				};
  			};"""

          if target_str in content:
              content = content.replace(target_str, replacement_str)
              with open("target/linux/mediatek/dts/mt7622-netgear-wax206.dts", "w") as f:
                  f.write(content)
              print("SUCCESS: 成功将 WAX206 UBI 分区扩容至 250MB！")
          else:
              # 如果缩进稍有变动，使用基于标签的稳健正则替换
              import re
              pattern = r"(partition@600000\s*\{\s*label\s*=\s*\"ubi\";\s*reg\s*=\s*<0x600000\s+)0x[0-9a-fA-F]+(>;)"
              new_content, count = re.subn(pattern, r"\g<1>0xfa00000\2", content)
              if count > 0:
                  with open("target/linux/mediatek/dts/mt7622-netgear-wax206.dts", "w") as f:
                      f.write(new_content)
                  print("SUCCESS: 正则成功匹配并扩容 UBI 分区至 250MB！")
              else:
                  print("ERROR: 未找到 WAX206 的 UBI 设备树节点！")
                  exit(1)
          '

          # 验证 DTS 注入效果
          echo "====== 验证 DTS 结果 ======"
          grep -A 4 -n 'label = "ubi";' target/linux/mediatek/dts/mt7622-netgear-wax206.dts

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 下载依赖包
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 整理产物
        run: |
          mkdir -p bin_output
          find openwrt/bin/targets/mediatek/mt7622/ -type f \( -name "*wax206*.itb" -o -name "*wax206*.bin" -o -name "*wax206*.img" \) -exec cp -v {} bin_output/ \;
          ls -lh bin_output/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netgear-wax206-firmware
          path: bin_output/
