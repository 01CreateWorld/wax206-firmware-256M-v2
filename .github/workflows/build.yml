name: Build WAX206 256M OpenWrt

on:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 初始化编译环境
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev file wget device-tree-compiler u-boot-tools

      - name: 克隆源码并直接注入 256M 分区修改
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cp .config openwrt/.config
          
          cd openwrt
          # 1. 查找包含 wax206 的所有 DTS/DTSI 文件
          DTS_FILES=$(find target/linux/mediatek/dts/ -name "*wax206*" -o -name "*netgear*")
          echo "匹配到的目标设备树文件："
          echo "$DTS_FILES"

          # 2. 打印当前文件中的原始分区段，留存日志
          echo "====== 原始分区内容对照 ======"
          grep -rnE "(ubi|partition@)" target/linux/mediatek/dts/mt7622* || true

          # 3. 执行容错替换：针对 mt7622 目录下的 Netgear 设备树进行全量正则匹配替换
          # 无论原始是 partition@2000000 还是 reg = <0x... 0x...>; 统统重置为全量 256M 空间范围 (0x4000000 0xc000000)
          for f in target/linux/mediatek/dts/mt7622-netgear*.dts*; do
            if [ -f "$f" ]; then
              sed -i -E 's/reg = <0x[0-9a-fA-F]+ 0x[0-9a-fA-F]+>;/\/* replaced *\/ reg = <0x4000000 0xc000000>;/g' "$f"
              sed -i -E 's/partition@[0-9a-fA-F]+/partition@4000000/g' "$f"
            fi
          done

          # 4. 修改 mt7622.mk 声明根卷空间
          sed -i '/define Device\/netgear_wax206/,/endef/ s/SUPPORTED_DEVICES += netgear,wax206/SUPPORTED_DEVICES += netgear,wax206\n  UBI_ROOT_SIZE := 160MiB/' target/linux/mediatek/image/mt7622.mk

          # 5. 校验：检查是否有任意文件成功注入了 0xc000000
          echo "====== 校验替换结果 ======"
          grep -rn "0xc000000" target/linux/mediatek/dts/ || { echo "::error::所有 DTS 文件中均未找到可替换项！"; exit 1; }
          grep -n "UBI_ROOT_SIZE := 160MiB" target/linux/mediatek/image/mt7622.mk || { echo "::error::Makefile 替换失败！"; exit 1; }
      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 下载依赖包
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 整理产物
        run: |
          mkdir -p bin_output
          find openwrt/bin/targets/mediatek/mt7622/ -type f \( -name "*wax206*.itb" -o -name "*wax206*.bin" -o -name "*wax206*.img" \) -exec cp -v {} bin_output/ \;
          ls -lh bin_output/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netgear-wax206-firmware
          path: bin_output/
